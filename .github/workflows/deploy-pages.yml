name: Deploy to GitHub Pages

# Builds the static export and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [claude/keep-files-2rr119]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static export
        env:
          # Project pages serve under /<repo> (case-sensitive). Change if you
          # use a custom domain or a user/organization page (then set to empty).
          NEXT_PUBLIC_BASE_PATH: /TDOMA-PPP
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
